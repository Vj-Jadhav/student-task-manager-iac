name: CI/CD Pipeline - Terraform & Cloudflare Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'application/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'application/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read
  pull-requests: write

jobs:
  # ============================================================================
  # Stage 1: Quality Gate & Validation (Runs on PRs and Pushes to main)
  # ============================================================================
  validate-and-plan:
    name: Terraform Lint, Validate & Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      # Step 1: Checkout repository (Pinned to commit SHA for supply-chain security)
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Step 2: Install HashiCorp Terraform CLI (Pinned to commit SHA)
      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.0"

      # Step 3: Sanitize credentials (strips newlines, quotes, or accidental "Bearer " prefix)
      - name: Sanitize Cloudflare Credentials
        shell: bash
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 <<'PY'
          import os, re
          token = os.environ.get('RAW_TOKEN', '').strip()
          token = re.sub(r'[\r\n\"\'`]+', '', token)
          token = re.sub(r'^-H\s+', '', token)
          token = re.sub(r'^Authorization:\s*', '', token, flags=re.I)
          token = re.sub(r'^Bearer\s+', '', token, flags=re.I)
          token = token.strip()

          account = os.environ.get('RAW_ACCOUNT_ID', '').strip()
          account = re.sub(r'[\r\n\"\'`\s]+', '', account)

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'CLOUDFLARE_API_TOKEN={token}\n')
              f.write(f'TF_VAR_cloudflare_api_token={token}\n')
              f.write(f'TF_VAR_cloudflare_account_id={account}\n')

          print(f'::add-mask::{token}')
          print(f'::add-mask::{account}')
          PY

      # Step 4: Enforce standard formatting conventions
      - name: Terraform Format Check
        run: terraform fmt -check

      # Step 5: Initialize Terraform backend & provider plugins
      - name: Terraform Init
        run: terraform init

      # Step 6: Validate configuration syntax and schema
      - name: Terraform Validate
        run: terraform validate

      # Step 7: Generate execution plan (Speculative, no changes applied)
      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_environment: ${{ github.event.inputs.environment || 'dev' }}
        run: terraform plan -no-color

  # ============================================================================
  # Stage 2: Controlled Production Deployment (Requires Environment Approval)
  # Never runs on pull requests. Only triggers on merged pushes to main or dispatch.
  # ============================================================================
  deploy-production:
    name: Deploy to Cloudflare
    needs: validate-and-plan
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.apply.outputs.worker_url }}
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.0"

      # Sanitize credentials before apply
      - name: Sanitize Cloudflare Credentials
        shell: bash
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 <<'PY'
          import os, re
          token = os.environ.get('RAW_TOKEN', '').strip()
          token = re.sub(r'[\r\n\"\'`]+', '', token)
          token = re.sub(r'^-H\s+', '', token)
          token = re.sub(r'^Authorization:\s*', '', token, flags=re.I)
          token = re.sub(r'^Bearer\s+', '', token, flags=re.I)
          token = token.strip()

          account = os.environ.get('RAW_ACCOUNT_ID', '').strip()
          account = re.sub(r'[\r\n\"\'`\s]+', '', account)

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'CLOUDFLARE_API_TOKEN={token}\n')
              f.write(f'TF_VAR_cloudflare_api_token={token}\n')
              f.write(f'TF_VAR_cloudflare_account_id={account}\n')

          print(f'::add-mask::{token}')
          print(f'::add-mask::{account}')
          PY

      - name: Terraform Init
        run: terraform init

      # Controlled deployment: Applies planned resources, never destroys
      - name: Terraform Apply
        id: apply
        env:
          TF_VAR_environment: ${{ github.event.inputs.environment || 'dev' }}
        run: |
          terraform apply -auto-approve
          echo "worker_url=$(terraform output -raw worker_url 2>/dev/null || echo '')" >> $GITHUB_OUTPUT

      - name: Print Deployment Outputs
        run: terraform output
