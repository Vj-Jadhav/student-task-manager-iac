
name: CI/CD Pipeline - Terraform & Cloudflare Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'application/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
      - 'application/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read
  pull-requests: write

jobs:
  # Stage 1: Validate and plan
  validate-and-plan:
    name: Terraform Lint, Validate & Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.0"

      - name: Sanitize Cloudflare Credentials
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 "${{ github.workspace }}/scripts/sanitize_env.py"

      - name: Verify Cloudflare Token
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          token = os.environ.get("CLOUDFLARE_API_TOKEN", "").strip()

          if not token:
              raise SystemExit("Cloudflare API token secret is missing.")

          request = urllib.request.Request(
              "https://api.cloudflare.com/client/v4/user/tokens/verify",
              headers={"Authorization": f"Bearer {token}"}
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.load(response)

              if result.get("success"):
                  print("Cloudflare API token is valid.")
              else:
                  print("Cloudflare API token verification failed.")
                  raise SystemExit(1)

          except urllib.error.HTTPError as error:
              print("Cloudflare token verification failed. HTTP status:", error.code)
              raise SystemExit(1)
          except urllib.error.URLError:
              print("Could not connect to Cloudflare API.")
              raise SystemExit(1)
          PY

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          TF_VAR_environment: ${{ github.event.inputs.environment || 'dev' }}
        run: terraform plan -no-color

  # Stage 2: Deploy to Cloudflare
  deploy-production:
    name: Deploy to Cloudflare
    needs: validate-and-plan

    if: >-
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    environment:
      name: production

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.0"

      - name: Sanitize Cloudflare Credentials
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 "${{ github.workspace }}/scripts/sanitize_env.py"

      - name: Verify Cloudflare Token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          token = os.environ.get("CLOUDFLARE_API_TOKEN", "").strip()

          if not token:
              raise SystemExit("Cloudflare API token secret is missing.")

          request = urllib.request.Request(
              "https://api.cloudflare.com/client/v4/user/tokens/verify",
              headers={"Authorization": f"Bearer {token}"}
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.load(response)

              if result.get("success"):
                  print("Cloudflare API token is valid.")
              else:
                  print("Cloudflare API token verification failed.")
                  raise SystemExit(1)

          except urllib.error.HTTPError as error:
              print("Cloudflare token verification failed. HTTP status:", error.code)
              raise SystemExit(1)
          except urllib.error.URLError:
              print("Could not connect to Cloudflare API.")
              raise SystemExit(1)
          PY

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        id: apply
        env:
          TF_VAR_environment: ${{ github.event.inputs.environment || 'dev' }}
        run: |
          terraform apply -auto-approve -input=false
          worker_url="$(terraform output -raw worker_url 2>/dev/null || true)"
          echo "worker_url=${worker_url}" >> "$GITHUB_OUTPUT"

      - name: Print Deployment Outputs
        run: terraform output
